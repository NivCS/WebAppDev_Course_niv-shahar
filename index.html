<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hotdog Flexbox</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- Header -->

  <header class="top-header">

    <div class="brand">

      <div class="brand-icon">
        🌭
      </div>

      <div>
        <h1>HOTDOG FLEXBOX</h1>
        <p>דוכן הנקניקיות</p>
      </div>

    </div>


    <div class="progress-area">

      <div class="progress-info">

        <span>התקדמות</span>

        <span>
          שלב
          <strong id="step-number">1</strong>
          מתוך
          <strong id="total-steps">8</strong>
        </span>

      </div>

      <div class="progress-bar">

        <div
          class="progress-fill"
          id="progress-fill">
        </div>

      </div>

    </div>

  </header>


  <main>

    <!-- Order -->

    <section class="order-card">

      <div class="order-title">

        <span class="order-number">
          ORDER
        </span>

        <span>
          ההזמנה שלך
        </span>

      </div>


      <div class="order-content">

        <div class="order-icon">
          🌭
        </div>

        <div>

          <h2 id="step-title"></h2>

          <p id="step-instruction"></p>

        </div>

      </div>

    </section>


    <!-- Game -->

    <section class="game-card">

      <div class="stall-sign">

        <span>★</span>

        HOTDOG STAND

        <span>★</span>

      </div>


      <div class="counter">

        <div class="board-label">
          🌭 סידור ההזמנה
        </div>


        <div
          class="arena-wrapper"
          id="arena">

          <!-- Target -->

          <div
            class="flex-layer target-layer"
            id="target-container">
          </div>


          <!-- Player -->

          <div
            class="flex-layer player-layer"
            id="flex-container">
          </div>


          <div class="target-label">
            היעד
          </div>

        </div>

      </div>

    </section>


    <!-- Controls -->

    <section class="controls-card">

      <div class="controls-header">

        <div>

          <div class="small-label">
            FLEXBOX CONTROLS
          </div>

          <h2>
            סדר את הנקניקיות
          </h2>

        </div>


        <div class="attempts-box">

          <span>ניסיונות</span>

          <strong id="attempts">
            0
          </strong>

        </div>

      </div>


      <div class="controls-grid">

        <div class="control">

          <label for="flex-direction">
            flex-direction
          </label>

          <select id="flex-direction">

            <option value="row">
              row
            </option>

            <option value="row-reverse">
              row-reverse
            </option>

            <option value="column">
              column
            </option>

            <option value="column-reverse">
              column-reverse
            </option>

          </select>

        </div>


        <div class="control">

          <label for="justify-content">
            justify-content
          </label>

          <select id="justify-content">

            <option value="flex-start">
              flex-start
            </option>

            <option value="center">
              center
            </option>

            <option value="flex-end">
              flex-end
            </option>

            <option value="space-between">
              space-between
            </option>

            <option value="space-around">
              space-around
            </option>

            <option value="space-evenly">
              space-evenly
            </option>

          </select>

        </div>


        <div class="control">

          <label for="align-items">
            align-items
          </label>

          <select id="align-items">

            <option value="flex-start">
              flex-start
            </option>

            <option value="center">
              center
            </option>

            <option value="flex-end">
              flex-end
            </option>

            <option value="stretch">
              stretch
            </option>

          </select>

        </div>


        <div class="control">

          <label for="flex-wrap">
            flex-wrap
          </label>

          <select id="flex-wrap">

            <option value="nowrap">
              nowrap
            </option>

            <option value="wrap">
              wrap
            </option>

            <option value="wrap-reverse">
              wrap-reverse
            </option>

          </select>

        </div>

      </div>


      <div class="actions">

        <button
          class="reset-button"
          id="reset-button">

          ↻ איפוס

        </button>


        <button
          class="check-button"
          id="check-button">

          בדוק פתרון ✓

        </button>

      </div>


      <div
        class="feedback"
        id="feedback">
      </div>

    </section>


    <!-- Footer -->

    <footer>

      <button
        class="nav-button"
        id="prev-button">

        → שלב קודם

      </button>


      <div
        class="dots"
        id="step-dots">
      </div>


      <button
        class="nav-button next"
        id="next-button">

        שלב הבא ←

      </button>

    </footer>

  </main>

</div>


<!-- Victory overlay -->

<div
  class="overlay hidden"
  id="success-overlay">

  <div class="success-box">

    <div class="success-icon">
      🏆
    </div>

    <div class="success-label">
      HOTDOG MASTER
    </div>

    <h2 id="success-title">
      כל הכבוד!
    </h2>

    <p id="success-message">
      פתרת את כל שלבי המשחק.
    </p>


    <div class="final-score">

      <span>
        ניסיונות:
      </span>

      <strong id="final-attempts">
        0
      </strong>

    </div>


    <button id="restart-button">
      שחק שוב 🌭
    </button>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
