  <!-- Panel 1 -->
  <section class="panel">
    <h2>פאנל 1</h2>
    <div class="controls">
      <label>flex-direction:
        <select onchange="setStyle('container1','flexDirection',this.value)">
          <option value="row">row</option>
          <option value="row-reverse">row-reverse</option>
          <option value="column">column</option>
          <option value="column-reverse">column-reverse</option>
        </select>
      </label>
      <label>justify-content:
        <select onchange="setStyle('container1','justifyContent',this.value)">
          <option value="flex-start">flex-start</option>
          <option value="flex-end">flex-end</option>
          <option value="center">center</option>
          <option value="space-between">space-between</option>
          <option value="space-around">space-around</option>
        </select>
      </label>
      <label>align-items:
        <select onchange="setStyle('container1','alignItems',this.value)">
          <option value="stretch">stretch</option>
          <option value="flex-start">flex-start</option>
          <option value="flex-end">flex-end</option>
          <option value="center">center</option>
        </select>
      </label>
      <label>flex-wrap:
        <select onchange="setStyle('container1','flexWrap',this.value)">
          <option value="nowrap">nowrap</option>
          <option value="wrap">wrap</option>
          <option value="wrap-reverse">wrap-reverse</option>
        </select>
      </label>
    </div>
    <div class="flex-container" id="container1">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </section>
