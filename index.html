<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Dog Flex</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="top-header">

      <div class="brand">
        <div class="brand-icon">🌭</div>

        <div>
          <h1>HOT DOG FLEX</h1>
          <p>דוכן הנקניקיות של Flexbox</p>
        </div>
      </div>

      <div class="progress-area">

        <div class="progress-info">
          <span>התקדמות</span>

          <strong>
            שלב <span id="step-num">1</span> מתוך 8
          </strong>
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            id="progress-fill"
          ></div>
        </div>

      </div>

    </header>


    <main>

      <section class="order-card">

        <div class="order-title">
          <span class="order-number">ORDER</span>
          <span>הזמנה חדשה</span>
        </div>

        <div class="order-content">

          <div class="order-icon">
            🌭
          </div>

          <div>
            <h2 id="goal-title">
              הזמנה מספר 1
            </h2>

            <p id="goal-text"></p>
          </div>

        </div>

      </section>


      <section class="game-card">

        <div class="stall-sign">
          <span>★</span>
          HOT DOG
          <span>★</span>
        </div>


        <div class="counter">

          <div class="board-label">
            🍽️ הרכבת ההזמנה
          </div>


          <div
            class="arena-wrapper"
            id="arena-wrapper"
          >

            <!-- Target container -->
            <div
              class="flex-layer target-layer"
              id="target-container"
            >

              <div class="target-bun">
                <img
                  src="images/bread.png"
                  alt="לחמנייה"
                >
              </div>

            </div>


            <!-- Player container -->
            <div
              class="flex-layer player-layer"
              id="flex-container"
            >

              <div class="hotdog-item">
                <img
                  src="images/hotdog.png"
                  alt="נקניקייה"
                >
              </div>

            </div>


            <div class="target-label">
              היעד
            </div>

          </div>

        </div>

      </section>


      <section class="controls-card">

        <div class="controls-header">

          <div>
            <span class="small-label">
              FLEXBOX CONTROLS
            </span>

            <h2>
              🛠️ הרכב את ההזמנה
            </h2>
          </div>


          <div class="attempts-box">
            <span>ניסיונות</span>
            <strong id="attempts">0</strong>
          </div>

        </div>


        <div class="controls-grid">

          <div class="control">

            <label for="sel-flex-direction">
              flex-direction
            </label>

            <select id="sel-flex-direction">

              <option value="row">
                row
              </option>

              <option value="row-reverse">
                row-reverse
              </option>

              <option value="column">
                column
              </option>

              <option value="column-reverse">
                column-reverse
              </option>

            </select>

          </div>


          <div class="control">

            <label for="sel-justify-content">
              justify-content
            </label>

            <select id="sel-justify-content">

              <option value="flex-start">
                flex-start
              </option>

              <option value="flex-end">
                flex-end
              </option>

              <option value="center">
                center
              </option>

              <option value="space-between">
                space-between
              </option>

              <option value="space-around">
                space-around
              </option>

              <option value="space-evenly">
                space-evenly
              </option>

            </select>

          </div>


          <div class="control">

            <label for="sel-align-items">
              align-items
            </label>

            <select id="sel-align-items">

              <option value="flex-start">
                flex-start
              </option>

              <option value="flex-end">
                flex-end
              </option>

              <option value="center">
                center
              </option>

              <option value="stretch">
                stretch
              </option>

              <option value="baseline">
                baseline
              </option>

            </select>

          </div>


          <div class="control">

            <label for="sel-flex-wrap">
              flex-wrap
            </label>

            <select id="sel-flex-wrap">

              <option value="nowrap">
                nowrap
              </option>

              <option value="wrap">
                wrap
              </option>

              <option value="wrap-reverse">
                wrap-reverse
              </option>

            </select>

          </div>

        </div>


        <div class="actions">

          <button
            class="check-button"
            id="check-btn"
          >
            <span>✓</span>
            בדוק את ההזמנה
          </button>

          <button
            class="reset-button"
            id="reset-btn"
          >
            ↺ איפוס
          </button>

        </div>


        <div
          class="feedback"
          id="feedback"
        ></div>

      </section>

    </main>


    <footer>

      <button
        class="nav-button"
        id="prev-btn"
      >
        → אחורה
      </button>


      <div
        class="dots"
        id="dots"
      ></div>


      <button
        class="nav-button next"
        id="next-btn"
        disabled
      >
        קדימה ←
      </button>

    </footer>

  </div>


  <div
    class="overlay hidden"
    id="success-overlay"
  >

    <div class="success-box">

      <div class="success-icon">
        🏆
      </div>

      <span class="success-label">
        ORDER COMPLETE
      </span>

      <h2>
        כל הכבוד!
      </h2>

      <p>
        השלמת את כל שלבי משחק ה־Flexbox.
      </p>

      <div class="final-score">

        <span>
          סה״כ ניסיונות
        </span>

        <strong id="final-attempts">
          0
        </strong>

      </div>

      <button id="restart-btn">
        🌭 התחל מחדש
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
