<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק Flexbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <header>
      <h1>🎮 משחק Flexbox</h1>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="step-label">שלב <span id="step-num">1</span> מתוך 6</div>
    </header>

    <main>

      <!-- Goal -->
      <section class="goal-section">
        <h2>🎯 המשימה</h2>
        <p id="goal-text"></p>
      </section>

      <!-- Editor -->
      <section class="editor-section">
        <h2>✏️ בחר ערכי CSS</h2>
        <div class="selects-grid">

          <div class="select-row">
            <label class="prop-label">flex-direction</label>
            <select id="sel-flex-direction" onchange="onSelectChange()">
              <option value="row">row</option>
              <option value="row-reverse">row-reverse</option>
              <option value="column">column</option>
              <option value="column-reverse">column-reverse</option>
            </select>
          </div>

          <div class="select-row">
            <label class="prop-label">justify-content</label>
            <select id="sel-justify-content" onchange="onSelectChange()">
              <option value="flex-start">flex-start</option>
              <option value="flex-end">flex-end</option>
              <option value="center">center</option>
              <option value="space-between">space-between</option>
              <option value="space-around">space-around</option>
              <option value="space-evenly">space-evenly</option>
            </select>
          </div>

          <div class="select-row">
            <label class="prop-label">align-items</label>
            <select id="sel-align-items" onchange="onSelectChange()">
              <option value="stretch">stretch</option>
              <option value="flex-start">flex-start</option>
              <option value="flex-end">flex-end</option>
              <option value="center">center</option>
              <option value="baseline">baseline</option>
            </select>
          </div>

          <div class="select-row">
            <label class="prop-label">flex-wrap</label>
            <select id="sel-flex-wrap" onchange="onSelectChange()">
              <option value="nowrap">nowrap</option>
              <option value="wrap">wrap</option>
              <option value="wrap-reverse">wrap-reverse</option>
            </select>
          </div>

        </div>
        <div class="editor-actions">
          <button id="check-btn" onclick="checkSolution()">✔ בדוק פתרון</button>
          <button id="reset-btn" onclick="resetStep()">↺ איפוס</button>
        </div>
        <div class="feedback-row">
          <div id="feedback" class="feedback"></div>
          <div id="attempts" class="attempts"></div>
        </div>
      </section>

      <!-- Preview -->
      <section class="preview-section">
        <h2>👁️ תצוגה מקדימה</h2>
        <div class="flex-arena" id="flex-container" dir="ltr">
          <!-- items injected by JS -->
        </div>
      </section>

    </main>

    <footer>
      <button id="prev-btn" onclick="prevStep()">→ אחורה</button>
      <div class="dots" id="dots"></div>
      <button id="next-btn" onclick="nextStep()" disabled>קדימה ←</button>
    </footer>

  </div>

  <div class="overlay hidden" id="success-overlay">
    <div class="overlay-box">
      <div class="overlay-emoji">🎉</div>
      <h2>כל הכבוד!</h2>
      <p>סיימת את כל 6 השלבים!</p>
      <button onclick="restartGame()">שחק שוב</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
